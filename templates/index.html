<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>ASCII Art Web</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">

    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">

    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">

    <link rel="manifest" href="/static/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Merienda:wght@300..900&family=Rye&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <header class="hero">

    <div class="hero-frame">

        <span class="hero-mark">
            ///
        </span>

        <div class="hero-line"></div>

        <h1>ASCII Art Web</h1>

        <div class="hero-line"></div>

        <span class="hero-mark">
            ///
        </span>

    </div>

    <p>
        Convert your text into ASCII art using different banner styles.
    </p>

</header>

        <form method="POST" action="/ascii-art" class="content-grid">

            <section class="card controls-card">

                <div class="panel-title banner-title">

                    <span>
                        Banner Style
                    </span>

                    <div class="title-accent"></div>

                    <span class="cyber-mark">
                        ///
                    </span>

                </div>

                <div class="radio-row">

                    <input
                        type="radio"
                        id="standard"
                        name="banner"
                        value="standard"
                        {{ if or (eq .Banner "") (eq .Banner "standard") }}checked{{ end }}
                    >

                    <label for="standard">
                        Standard
                    </label>

                </div>

                <div class="radio-row">

                    <input
                        type="radio"
                        id="shadow"
                        name="banner"
                        value="shadow"
                        {{ if eq .Banner "shadow" }}checked{{ end }}
                    >

                    <label for="shadow">
                        Shadow
                    </label>

                </div>

                <div class="radio-row">

                    <input
                        type="radio"
                        id="thinkertoy"
                        name="banner"
                        value="thinkertoy"
                        {{ if eq .Banner "thinkertoy" }}checked{{ end }}
                    >

                    <label for="thinkertoy">
                        Thinkertoy
                    </label>

                </div>

               <button class="generate-btn" type="submit">

    <span class="btn-icon">
        ⚡
    </span>

    <span>
        Generate ASCII Art
    </span>

</button>

                {{ if .Error }}

                <div class="error-box">

                    <p>{{ .Error }}</p>

                </div>

                {{ end }}

            </section>

            <section class="card workspace-card">

                <div>

                    <div class="panel-title">

                        <span>
                            Enter your text
                        </span>

                        <div class="title-accent"></div>

                        <span class="cyber-mark">
                            ///
                        </span>

                    </div>

                    <textarea
                        id="text-input"
                        name="text"
                        rows="6"
                    >{{ .Text }}</textarea>

                </div>

                <div class="panel-title">

                    <span>
                        Generated ASCII Art
                    </span>

                    <div class="title-accent"></div>

                    <span class="cyber-mark">
                        ///
                    </span>

                </div>

                <div class="ascii-output">

                    <pre>{{ .Result }}</pre>

                </div>

            </section>

        </form>

        <footer class="footer-frame">

    <span class="footer-icon">
        🎮
    </span>

    <p>
        Created by gpapadaki | elgeorgiou
    </p>

    <span class="footer-icon">
        ♥
    </span>

</footer>

    </div>

</body>

</html>
