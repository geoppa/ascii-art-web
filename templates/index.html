<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ASCII Art Web</title>

```
<link rel="stylesheet" href="/static/style.css">
```

</head>

<body>

```
<div class="container">

    <header class="hero">

        <h1>ASCII Art Web</h1>

        <p>
            Convert your text into ASCII art using different banner styles.
        </p>

    </header>

    <main class="content-grid">

        <section class="card controls-card">

            <form method="POST" action="/ascii-art">

                <label>
                    Banner Style
                </label>

                <div>

                    <input
                        type="radio"
                        id="standard"
                        name="banner"
                        value="standard"
                        checked
                    >

                    <label for="standard">
                        Standard
                    </label>

                </div>

                <div>

                    <input
                        type="radio"
                        id="shadow"
                        name="banner"
                        value="shadow"
                    >

                    <label for="shadow">
                        Shadow
                    </label>

                </div>

                <div>

                    <input
                        type="radio"
                        id="thinkertoy"
                        name="banner"
                        value="thinkertoy"
                    >

                    <label for="thinkertoy">
                        Thinkertoy
                    </label>

                </div>

                <button class="generate-btn" type="submit">
                    Generate ASCII Art
                </button>

                <div class="error-box">

                    <p>{{ .Error }}</p>

                </div>

        </section>

        <section class="card workspace-card">

                <div>

                    <label for="text-input">
                        Enter your text
                    </label>

                    <textarea
                        id="text-input"
                        name="text"
                        rows="8"
                    >{{ .Text }}</textarea>

                </div>

                <h2>
                    Generated ASCII Art
                </h2>

                <div class="ascii-output">

                    <pre>{{ .Result }}</pre>

                </div>

            </form>

        </section>

    </main>

    <footer>

        <p>
            Created by gpapadaki | elgeorgiou
        </p>

    </footer>

</div>
```

</body>

</html>
